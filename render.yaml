services:
  - type: web
    name: devforge
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: AUTH_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: openrouter/free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: devforge-db
          property: connectionString

databases:
  - name: devforge-db
    plan: free
    databaseName: devforge
    user: devforge
